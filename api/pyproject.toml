[project]
name = "sukat-api"
version = "0.1.0"
description = "Sukat backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
